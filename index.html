<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>附近的中油站 | 直營 / 加盟 / 其他</title>
<meta name="description" content="打開就知道最近的中油加油站是直營、加盟還是其他站別，賣什麼、地址在哪，也能找最近的直營站或加盟站。">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header id="topbar">
  <h1>附近的中油站</h1>
  <div id="status" class="status">載入資料中…</div>
</header>

<main class="home">

  <section id="heroCard" class="hero-card">
    <div id="heroStatus" class="hero-status">正在定位…</div>
    <div id="heroContent" class="hero-content" hidden>
      <div id="heroDetail"></div>
      <div id="heroMap" class="hero-map"></div>
    </div>
  </section>

  <button id="retryLocateBtn" class="secondary-btn" hidden>🔄 重新定位</button>

  <section class="panel quick-actions">
    <div class="section-label">找最近的...</div>
    <div class="quick-actions-row">
      <button class="chip-btn all active" data-type="">不限站別</button>
      <button class="chip-btn direct" data-type="direct">直營站</button>
      <button class="chip-btn franchise" data-type="franchise">加盟站</button>
      <button class="chip-btn fishing" data-type="fishing">其他站</button>
    </div>
  </section>

  <section class="panel fallback-location" id="fallbackSection" hidden>
    <p class="hint">沒有定位權限？改用縣市／鄉鎮區估算位置：</p>
    <div class="row">
      <select id="citySelect"><option value="">選擇縣市</option></select>
      <select id="districtSelect"><option value="">選擇鄉鎮區</option></select>
    </div>
  </section>

  <a href="map.html" class="explore-link">🗺️ 打開完整地圖，篩選、看列表 →</a>

</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="assets/common.js"></script>
<script src="assets/home.js"></script>
</body>
</html>
